[package]
name = "chengyin"
version = "0.4.0"
description = "澄音 — local music player for Windows"
authors = ["Chengyin"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chengyin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lofty = "0.25.4"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "alac", "isomp4"] }
cpal = "0.18.2"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
walkdir = "2.5.0"
parking_lot = "0.12.5"
base64 = "0.23.1"
tauri-plugin-dialog = "2.8.3"
rubato = "0.15"
sha2 = "0.11.1"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "gzip"] }
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
hound = "3.5.1"

[target."cfg(windows)".dependencies]
souvlaki = "0.8.3"
wasapi = "0.26.0"
